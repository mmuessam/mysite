    <circle cx="8" cy="8" r="6" fill="#6cff90"/>
    <text x="28" y="14">AVAILABLE FOR SELECT WORK · 2026</text>
  </g>
  <g transform="translate(1120, 100)" fill="#a1a1a1" font-family="ui-monospace, monospace" font-size="18" letter-spacing="3" text-anchor="end">
    <text x="0" y="14">GIZA · GMT+2</text>
  </g>

  <!-- Center brand block -->
  <g transform="translate(80, 380)">
    <text font-family="Inter Tight, system-ui, sans-serif" font-weight="500" font-size="160" fill="#fafafa" letter-spacing="-7">
      <tspan x="0" y="0">I design</tspan>
    </text>
    <text font-family="Instrument Serif, serif" font-style="italic" font-weight="400" font-size="190" fill="#f25d4f" letter-spacing="-3">
      <tspan x="0" y="200">decisions,</tspan>
    </text>
    <text font-family="Inter Tight, system-ui, sans-serif" font-weight="500" font-size="160" fill="#fafafa" letter-spacing="-7">
      <tspan x="0" y="380">not just </tspan>
      <tspan font-family="Instrument Serif, serif" font-style="italic" font-weight="400" font-size="190" fill="#f25d4f" letter-spacing="-3">screens.</tspan>
    </text>
  </g>

  <!-- Divider -->
  <line x1="80" y1="930" x2="1120" y2="930" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Signature row -->
  <g transform="translate(80, 1010)">
    <line x1="0" y1="6" x2="80" y2="6" stroke="#525252" stroke-width="1"/>
    <text x="100" y="14" font-family="Inter Tight, system-ui, sans-serif" font-weight="500" font-size="32" fill="#fafafa" letter-spacing="-0.5">
      Mahmoud Essam
    </text>
    <text x="350" y="14" font-family="Instrument Serif, serif" font-style="italic" font-size="32" fill="#f25d4f">
      · Product Design Lead
    </text>
  </g>

  <!-- Bottom meta -->
  <g transform="translate(80, 1090)" fill="#737373" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2">
    <text x="0" y="14">8+ YEARS · 50+ CLIENTS · 5+ YEARS AI</text>
  </g>
  <g transform="translate(1120, 1090)" fill="#fafafa" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2" text-anchor="end">
    <text x="0" y="14">MAHMOUDESSAM.DESIGN</text>
