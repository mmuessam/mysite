<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f25d4f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f25d4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f25d4f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f25d4f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f25d4f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0a0a0a"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <!-- Top status -->
